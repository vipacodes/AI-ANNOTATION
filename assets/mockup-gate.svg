<svg viewBox="0 0 660 400" role="img" aria-label="screening gate, microtask strip, real payout shape" style="width:100%;height:auto;display:block;border-radius:12px;border:1px solid #232b39"><defs><style>@keyframes atPulse{0%,100%{opacity:.25}50%{opacity:1}}@keyframes atSlide{0%{transform:translateX(-8px)}50%{transform:translateX(0)}100%{transform:translateX(8px)}}@keyframes atBar{0%{width:6%}70%{width:82%}100%{width:82%}}@keyframes atBlink{50%{opacity:.35}}@keyframes atIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}.p{animation:atPulse 2s infinite}.s{animation:atSlide 3.4s ease-in-out infinite alternate}.b{animation:atBar 6s ease-out infinite}.k{animation:atBlink 1.4s steps(2) infinite}.i{animation:atIn .7s cubic-bezier(.2,.8,.2,1) both}text{font-family:ui-sans-serif,system-ui,Segoe UI,Roboto,sans-serif}</style></defs><rect width="660" height="400" fill="#0e1219"/><rect width="660" height="30" fill="#151b25"/><circle cx="16" cy="15" r="4.5" fill="#ff5f6d"/><circle cx="32" cy="15" r="4.5" fill="#f5b13d"/><circle cx="48" cy="15" r="4.5" fill="#39d98a"/><text x="68" y="19" fill="#93a0b4" font-size="11">screening gate, microtask strip, real payout shape</text><rect x="560" y="8" width="88" height="15" rx="7" fill="#4cc9f022" stroke="#4cc9f055"/><text x="604" y="19" fill="#4cc9f0" font-size="9.5" text-anchor="middle" font-weight="700">ILLUSTRATIVE</text><g class="i"><rect x="16" y="42" width="628" height="150" rx="9" fill="#141a24" stroke="#232b39"/><text x="27" y="60" fill="#6d7c92" font-size="9.5" font-weight="700" letter-spacing="1">SCREENING · the gate is the whole product</text></g><text x="28" y="72" fill="#e7ecf3" font-size="12" font-weight="700">Live interview, recorded and scored</text><rect x="28" y="84" width="272" height="88" rx="8" fill="#0e131c" stroke="#242e3d"/><circle cx="164" cy="120" r="20" fill="#4cc9f022" stroke="#4cc9f088"/><text x="164" y="125" fill="#4cc9f0" font-size="10" text-anchor="middle" font-weight="800">YOU</text